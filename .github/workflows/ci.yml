name: PhiLearn CI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: node --test interop/skill-passport-verifier.test.mjs
      - run: node --check interop/verify-passport.mjs
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - run: python3 -m py_compile bridge/server.py
